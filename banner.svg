<svg width="900" height="220" viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07090f"/>
      <stop offset="55%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#0f1f3f"/>
    </linearGradient>

    <pattern id="pcbGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1f6feb" stroke-width="0.6" stroke-opacity="0.09"/>
    </pattern>

    <pattern id="hazard" width="20" height="20" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="20" height="20" fill="#0a0d14"/>
      <rect width="10" height="20" fill="#ffd400"/>
    </pattern>

    <radialGradient id="redGlow" cx="0.5" cy="0" r="1">
      <stop offset="0%" stop-color="#ff2d3f" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ff2d3f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blueGlow" cx="0.5" cy="0" r="1">
      <stop offset="0%" stop-color="#2f81f7" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#2f81f7" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="shape">
      <polygon points="0,0 868,0 900,32 900,220 32,220 0,188"/>
    </clipPath>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .track { fill: none; stroke: #1a2d52; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .pulse { fill: none; stroke: #58a6ff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 22 74; animation: dataFlow 2.6s linear infinite; }
      .pulse-red { stroke: #ff3b4e; }
      .pulse-rev { animation-direction: reverse; animation-duration: 3.1s; }
      .pulse-fast { animation-duration: 2s; }
      @keyframes dataFlow { to { stroke-dashoffset: -96; } }

      /* siren: red and blue alternate */
