  <line x1="678" y1="115" x2="837" y2="115" stroke="#1f6feb" stroke-opacity="0.2" stroke-width="1" stroke-dasharray="2 2"/>
  <path class="wave" filter="url(#glow)" d="M678 115 H706 L713 98 L720 132 L727 92 L734 136 L741 108 L747 115 H778 L785 103 L792 127 L798 115 H837"/>

  <text class="hud-sub" x="679" y="144">PWR: 3.3V    LINK: ACTIVE</text>
