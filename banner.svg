  <text class="status" x="216" y="166">SYS_ONLINE  •  ESP32  •  GIS  •  RF_COMMS</text>

  <rect x="665" y="66" width="185" height="88" rx="8" fill="#090d14" fill-opacity="0.75" stroke="#1f6feb" stroke-opacity="0.5" stroke-width="1.2"/>
