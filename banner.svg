<svg width="900" height="220" viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#10264d"/>
    </linearGradient>
    <style>
      .trace{fill:none;stroke:#1f6feb;stroke-width:2;stroke-dasharray:8 10;animation:flow 2s linear infinite}
      .rev{animation-direction:reverse}
      @keyframes flow{to{stroke-dashoffset:-36}}
      .pad{fill:#58a6ff;animation:blink 1.6s ease-in-out infinite}
      @keyframes blink{50%{opacity:.25}}
      .title{font:700 46px 'Courier New',monospace;fill:#ffffff}
      .sub{font:18px 'Courier New',monospace;fill:#58a6ff}
      .chip{font:700 14px 'Courier New',monospace;fill:#58a6ff}
    </style>
  </defs>

  <rect width="900" height="220" fill="url(#bg)"/>

  <!-- traces -->
  <path class="trace" d="M70 90 H30 V40 H0"/>
  <path class="trace rev" d="M70 130 H30 V180 H0"/>
  <path class="trace" d="M110 70 V30 H320 V0"/>
  <path class="trace rev" d="M110 150 V190 H380 V220"/>
  <path class="trace" d="M620 30 H760 V80 H900"/>
  <path class="trace rev" d="M660 190 H800 V140 H900"/>

  <!-- pads -->
  <circle class="pad" cx="30" cy="40" r="4"/>
  <circle class="pad" cx="30" cy="180" r="4"/>
  <circle class="pad" cx="320" cy="30" r="4"/>
  <circle class="pad" cx="380" cy="190" r="4"/>
  <circle class="pad" cx="760" cy="80" r="4"/>
  <circle class="pad" cx="800" cy="140" r="4"/>

  <!-- chip -->
  <rect x="70" y="70" width="80" height="80" rx="8" fill="#0d1117" stroke="#1f6feb" stroke-width="2"/>
  <text class="chip" x="110" y="115" text-anchor="middle">ESP32</text>

  <!-- text -->
  <text class="title" x="190" y="108">Dekdoi07</text>
  <text class="sub" x="192" y="142">Computer Science &amp; Embedded Systems</text>
</svg>
